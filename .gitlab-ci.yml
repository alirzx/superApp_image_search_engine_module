# SuperApp Module 04: same organizational shell runner as Background Removal / Persian NLP.
# GitLab main; build-first, manual deploy and opt-in startup. No Docker-in-Docker.
stages: [validate, test, build, deploy]
variables:
  PIP_PRIMARY_INDEX_URL: "https://package-mirror.liara.ir/repository/pypi/simple"
  PIP_FALLBACK_INDEX_URL: "https://mirror2.chabokan.net/pypi/simple/"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DEPLOY_DIR: "/opt/apps/ai-service/image_search_engine_module"
  RUN_SERVICES: "0"
.shell: &shell
  tags: [linux, bina, shell]
validate-source:
  <<: *shell
  stage: validate
  script:
    - |
      set -eu
      for f in .env.example .env.production.example .dockerignore .gitignore docker-compose.yml docker-compose.production.yml backend/Dockerfile backend/requirements.txt frontend/Dockerfile frontend/package.json ops/nginx.conf scripts/download_model.py scripts/verify_model.py; do
        test -f "$f" || { echo "Missing: $f"; exit 1; }
      done
      command -v docker >/dev/null
      docker compose version
      API_KEY=ci-placeholder-key-minimum-24-characters docker compose config --quiet
      python3 -m compileall -q backend/app
backend-tests:
  <<: *shell
  stage: test
  script:
    - |
      set -eu
      python3 -m venv .ci-venv
      . .ci-venv/bin/activate
      python -m pip install --index-url "$PIP_PRIMARY_INDEX_URL" -r backend/requirements-ci.txt || python -m pip install --index-url "$PIP_FALLBACK_INDEX_URL" -r backend/requirements-ci.txt
      PYTHONPATH=backend python -m pytest backend/tests -q
  after_script:
    - rm -rf .ci-venv
frontend-build:
  <<: *shell
  stage: test
  script:
    - |
      set -eu
      cd frontend
      # After a reviewed package-lock.json is committed, migrate to npm ci.
      npm install --no-audit --no-fund
      npm run build
  after_script:
    - rm -rf frontend/node_modules frontend/dist
build-images:
  <<: *shell
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never
  script:
    - |
      set -eu
      : "${API_KEY:=ci-build-only-placeholder-123456789012345}"
      export API_KEY
      docker compose config --quiet
      docker compose build api ui
      echo "Build only; services not started."
# Required File variables: SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, ENV_FILE.
# Required normal variables: SSH_USER, SSH_PORT, VM_IPADDRESS.
deploy:
  <<: *shell
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never
  before_script:
    - |
      set -eu
      command -v ssh-agent >/dev/null
      command -v ssh >/dev/null
      command -v scp >/dev/null
      : "${SSH_USER:?SSH_USER CI variable required}"
      : "${SSH_PORT:?SSH_PORT CI variable required}"
      : "${VM_IPADDRESS:?VM_IPADDRESS CI variable required}"
      : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY File CI variable required}"
      : "${SSH_KNOWN_HOSTS:?SSH_KNOWN_HOSTS File CI variable required}"
      : "${ENV_FILE:?ENV_FILE File CI variable required}"
      test -f "$SSH_PRIVATE_KEY" && test -f "$SSH_KNOWN_HOSTS" && test -f "$ENV_FILE"
      eval "$(ssh-agent -s)"
      chmod 600 "$SSH_PRIVATE_KEY"
      ssh-add "$SSH_PRIVATE_KEY"
      mkdir -p "$HOME/.ssh"
      chmod 700 "$HOME/.ssh"
      cp "$SSH_KNOWN_HOSTS" "$HOME/.ssh/known_hosts"
      chmod 600 "$HOME/.ssh/known_hosts"
  script:
    - |
      set -eu
      TARGET="${DEPLOY_DIR:-/opt/apps/ai-service/image_search_engine_module}"
      case "$TARGET" in *[!A-Za-z0-9_./-]*|'') echo 'Unsafe DEPLOY_DIR'; exit 1 ;; esac
      REMOTE="${SSH_USER}@${VM_IPADDRESS}"
      ssh -p "$SSH_PORT" -o BatchMode=yes "$REMOTE" "test -d '$TARGET/.git' || { echo 'Missing server Git checkout'; exit 1; }"
      scp -P "$SSH_PORT" -o BatchMode=yes "$ENV_FILE" "$REMOTE:$TARGET/.env"
      ssh -p "$SSH_PORT" -o BatchMode=yes "$REMOTE" "chmod 600 '$TARGET/.env'"
      ssh -p "$SSH_PORT" -o BatchMode=yes "$REMOTE" "set -eu; cd '$TARGET'; git switch main; git fetch origin main; git merge --ff-only origin/main; docker compose config --quiet; docker compose build api ui"
      if [ "${RUN_SERVICES:-0}" = "1" ]; then
        ssh -p "$SSH_PORT" -o BatchMode=yes "$REMOTE" "set -eu; cd '$TARGET'; python3 scripts/verify_model.py --path .models/siglip2; docker compose up -d --no-build --wait --wait-timeout 240 api ui"
      else
        echo 'Build completed, RUN_SERVICES=0. Containers intentionally not started.'
      fi
  after_script:
    - ssh-agent -k >/dev/null 2>&1 || true
