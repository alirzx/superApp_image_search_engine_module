
stages:
  - validate
  - test
  - build
  - deploy

variables:
  PIP_PRIMARY_INDEX_URL: "https://package-mirror.liara.ir/repository/pypi/simple"
  PIP_FALLBACK_INDEX_URL: "https://mirror2.chabokan.net/pypi/simple/"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DEPLOY_DIR: "/opt/apps/ai-service/image_search_engine_module"
  RUN_SERVICES: "0"

.shell:
  tags:
    - linux
    - bina
    - shell

validate-source:
  extends: .shell
  stage: validate
  script:
    - |
      set -eu

      echo "Validating source files..."

      for f in \
        .env.example \
        .env.production.example \
        .dockerignore \
        .gitignore \
        docker-compose.yml \
        docker-compose.production.yml \
        backend/Dockerfile \
        backend/requirements.txt \
        frontend/Dockerfile \
        frontend/package.json \
        ops/nginx.conf \
        scripts/download_model.py \
        scripts/verify_model.py
      do
        test -f "$f" || {
          echo "ERROR: Missing file: $f"
          exit 1
        }
      done

      command -v docker
      docker compose version

      API_KEY=ci-placeholder-key-minimum-24-characters \
        docker compose config --quiet

      python3 -m compileall -q backend/app

      echo "Source validation passed."

backend-tests:
  extends: .shell
  stage: test
  script:
    - |
      set -eu

      cleanup() {
        rm -rf .ci-venv
      }
      trap cleanup EXIT

      python3 --version
      python3 -m venv .ci-venv
      . .ci-venv/bin/activate

      if ! python -m pip install \
        --index-url "$PIP_PRIMARY_INDEX_URL" \
        -r backend/requirements-ci.txt
      then
        echo "Primary PyPI mirror failed. Trying fallback..."

        python -m pip install \
          --index-url "$PIP_FALLBACK_INDEX_URL" \
          -r backend/requirements-ci.txt
      fi

      PYTHONPATH=backend python -m pytest backend/tests -q

      echo "Backend tests passed."

frontend-build:
  extends: .shell
  stage: test
  script:
    - |
      set -eu

      cd frontend

      if [ -f package-lock.json ]; then
        npm ci --no-audit --no-fund
      else
        echo "WARNING: package-lock.json missing. Using npm install."
        npm install --no-audit --no-fund
      fi

      npm run build

      echo "Frontend build passed."
  after_script:
    - rm -rf frontend/node_modules frontend/dist

build-images:
  extends: .shell
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never
  script:
    - |
      set -eu

      export API_KEY="${API_KEY:-ci-build-only-placeholder-123456789012345}"

      docker info
      docker compose config --quiet
      docker compose build api ui

      echo "Build completed. Services were not started."

# GitLab CI/CD variables:
#
# File:
#   ENV_FILE
#
# Regular:
#   SSH_PRIVATE_KEY
#   SSH_USER
#   SSH_PORT
#   VM_IPADDRESS

deploy:
  extends: .shell
  stage: deploy

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never

  before_script:
    - |
      set -eu

      command -v ssh-agent
      command -v ssh
      command -v ssh-keyscan
      command -v scp
      command -v mktemp

      : "${SSH_USER:?SSH_USER is required}"
      : "${SSH_PORT:?SSH_PORT is required}"
      : "${VM_IPADDRESS:?VM_IPADDRESS is required}"
      : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY is required}"
      : "${ENV_FILE:?ENV_FILE File variable is required}"

      test -f "$ENV_FILE"

      mkdir -p "$HOME/.ssh"
      chmod 700 "$HOME/.ssh"

      # Scan remote SSH host key.
      ssh-keyscan -p "$SSH_PORT" "$VM_IPADDRESS" \
        > "$HOME/.ssh/known_hosts"

      test -s "$HOME/.ssh/known_hosts"
      chmod 600 "$HOME/.ssh/known_hosts"

      # Start SSH agent.
      eval "$(ssh-agent -s)"

      # Convert regular CI variable into a temporary key file.
      KEY_FILE="$(mktemp)"
      chmod 600 "$KEY_FILE"

      printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"

      ssh-add "$KEY_FILE"

      rm -f "$KEY_FILE"

  script:
    - |
      set -eu

      TARGET="${DEPLOY_DIR:-/opt/apps/ai-service/image_search_engine_module}"

      case "$TARGET" in
        *[!A-Za-z0-9_./-]*|'')
          echo "ERROR: Unsafe DEPLOY_DIR"
          exit 1
          ;;
      esac

      REMOTE="${SSH_USER}@${VM_IPADDRESS}"

      echo "Checking remote deployment directory..."

      ssh -p "$SSH_PORT" -o BatchMode=yes "$REMOTE" \
        "test -d '$TARGET/.git' || { echo 'Missing server Git checkout'; exit 1; }"

      echo "Uploading production environment..."

      scp -P "$SSH_PORT" -o BatchMode=yes \
        "$ENV_FILE" "$REMOTE:$TARGET/.env"

      ssh -p "$SSH_PORT" -o BatchMode=yes "$REMOTE" \
        "chmod 600 '$TARGET/.env'"

      echo "Updating repository and building images..."

      ssh -p "$SSH_PORT" -o BatchMode=yes "$REMOTE" \
        "set -eu; cd '$TARGET'; git switch main; git fetch origin main; git merge --ff-only origin/main; docker compose config --quiet; docker compose build api ui"

      if [ "${RUN_SERVICES:-0}" = "1" ]; then

        echo "Verifying model and starting services..."

        ssh -p "$SSH_PORT" -o BatchMode=yes "$REMOTE" \
          "set -eu; cd '$TARGET'; python3 scripts/verify_model.py --path .models/siglip2; docker compose up -d --no-build --wait --wait-timeout 240 api ui"

      else

        echo "Build completed."
        echo "RUN_SERVICES=0. Containers intentionally not started."

      fi

  after_script:
    - ssh-agent -k >/dev/null 2>&1 || true
