
name: superapp-image-search

x-pip-build-args: &pip-build-args
  PIP_PRIMARY_INDEX_URL: ${PIP_PRIMARY_INDEX_URL:-https://package-mirror.liara.ir/repository/pypi/simple}
  PIP_SECONDARY_INDEX_URL: ${PIP_SECONDARY_INDEX_URL:-https://mirror2.chabokan.net/pypi/simple/}
  PIP_FALLBACK_INDEX_URL: ${PIP_FALLBACK_INDEX_URL:-https://pypi.org/simple}
  PYTORCH_CPU_INDEX_URL: ${PYTORCH_CPU_INDEX_URL:-https://download.pytorch.org/whl/cpu}
  APT_PRIMARY_DEBIAN_URL: ${APT_PRIMARY_DEBIAN_URL:-https://mirror.metanet.ch/debian}
  APT_PRIMARY_SECURITY_URL: ${APT_PRIMARY_SECURITY_URL:-https://mirror.metanet.ch/debian-security}
  APT_FALLBACK_DEBIAN_URL: ${APT_FALLBACK_DEBIAN_URL:-https://mirrors.huaweicloud.com/repository/debian}
  APT_FALLBACK_SECURITY_URL: ${APT_FALLBACK_SECURITY_URL:-https://mirrors.huaweicloud.com/repository/debian-security}

services:
  # Initializes persistent storage permissions before API startup.
  data-init:
    image: alpine:3.21
    user: "0:0"
    restart: "no"
    environment:
      APP_UID: ${RUN_UID:-1000}
      APP_GID: ${RUN_GID:-1000}
    volumes:
      - ${DATA_PATH:-./.data}:/data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /data/metadata /data/faiss /data/uploads
        chown -R "$$APP_UID:$$APP_GID" /data
        chmod -R u+rwX /data
        echo "Data directory permissions initialized."

  # Runs automatically before API. Fresh server deployments download the
  # pinned Hugging Face model; subsequent runs verify the saved manifest.
  # Mirrors below are for PyPI only, not Hugging Face model weights.
  model-setup:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: *pip-build-args
    restart: "no"
    user: "0:0"
    environment:
      MODEL_ID: ${MODEL_ID:-google/siglip2-base-patch32-256}
      MODEL_REVISION: ${MODEL_REVISION:-}
      MODEL_LOCAL_PATH: /models/siglip2
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    volumes:
      - ${MODEL_PATH:-./.models/siglip2}:/models/siglip2
    entrypoint: ["python", "/srv/scripts/ensure_model.py"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "${SETUP_CPUS:-2}"
    mem_limit: ${SETUP_MEMORY_LIMIT:-2g}

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: *pip-build-args

    depends_on:
      data-init:
        condition: service_completed_successfully
      model-setup:
        condition: service_completed_successfully

    environment:
      APP_ENV: ${APP_ENV:-development}
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-true}
      API_KEY: ${API_KEY:?Set API_KEY in .env (min 24 characters)}
      MODEL_ID: ${MODEL_ID:-google/siglip2-base-patch32-256}
      MODEL_LOCAL_PATH: /models/siglip2
      MODEL_REVISION: ${MODEL_REVISION:-}
      INFERENCE_THREADS: ${INFERENCE_THREADS:-2}
      VECTOR_BACKEND: faiss
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-10}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-20000000}
      MAX_TOP_K: ${MAX_TOP_K:-50}
      MAX_BATCH_IMAGES: ${MAX_BATCH_IMAGES:-20}
      DATA_DIR: /data
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: ${INFERENCE_THREADS:-2}
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    volumes:
      - ${DATA_PATH:-./.data}:/data
      - ${MODEL_PATH:-./.models/siglip2}:/models/siglip2:ro

    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8004}:8004"

    restart: unless-stopped
    init: true
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"

    cpus: "${API_CPUS:-4}"
    mem_limit: ${API_MEMORY_LIMIT:-6g}
    pids_limit: 256

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8085}:80"

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped
    init: true

    cpus: "${UI_CPUS:-0.5}"
    mem_limit: ${UI_MEMORY_LIMIT:-256m}

    security_opt:
      - no-new-privileges:true
